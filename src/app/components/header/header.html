<header class="sticky top-0 z-50 border-b border-line bg-page">
  <nav class="mx-auto flex h-14 max-w-5xl items-center justify-between px-6">
    <a href="#inicio" class="flex items-center gap-2 font-medium text-ink">
      <img src="images/favicon-mj.png" width="28" height="28" alt="" />
      Marcos Junior
    </a>
    <ul class="flex gap-6 text-sm text-ink-2">
      @for (s of secoes; track s.id) {
        <li [class]="s.soDesktop ? 'hidden sm:list-item' : ''">
          <a [href]="'#' + s.id"
             [attr.aria-current]="ativa() === s.id ? 'true' : null"
             class="relative py-1 transition-colors duration-150 ease-soft hover:text-ink aria-[current=true]:text-ink after:absolute after:inset-x-0 after:-bottom-1 after:h-px after:origin-left after:scale-x-0 after:bg-cyan after:transition-transform after:duration-300 after:ease-soft aria-[current=true]:after:scale-x-100">
            {{ s.nome }}
          </a>
        </li>
      }
    </ul>
  </nav>
</header>
